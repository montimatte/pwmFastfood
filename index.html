<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="mystyle.css">
</head>
<body class="centerBody">
    <div class="container">
        <div class="row">
            <div class="col"></div>
            <div class="col">
                <div id="form">
                    <form onsubmit="login(event)">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        
                        <div class="mb-3">
                            <div class="d-flex justify-content-center">
                                <button type="submit" class="btn btn-primary">Login</button>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="mt-5 d-flex justify-content-center">
                    <a href="signup.html"><button class="btn btn-outline-primary">Registrati</button></a>
                </div>

            </div>
            <div class="col"></div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
    <script>

        function login(event) {
            event.preventDefault(); //blocca il refresh della pagina

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const user = {
                username: username,
                password: password
            };

            const options = {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(user)
            };

            fetch("http://server-t410:3000/login", options)
                .then(response => response.json())
                .then(result => {
                    console.log(result);
                    if(result.success===true){
                        localStorage.setItem("auth",result.id); //l'utente è autenticato
                        //rendirizzo alla pagina corretta in base al tipo di account
                        if(result.user=="cliente"){
                            localStorage.setItem("accType","cliente"); //salvo se si tratta di un cliente od un ristoratore
                            window.location.replace("pages/cliente/cliente.html");
                        }
                        else if(result.user=="ristoratore"){
                            localStorage.setItem("accType","ristoratore");
                            window.location.replace("pages/ristoratore/ristoratore.html");
                        }
                    }
                    else{
                        alert(result.message);
                    }
                });
        }
    </script>
</body>
</html>
