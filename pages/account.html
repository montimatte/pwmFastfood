<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dettagli Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>

<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Navbar</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="" id="homelink">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Link</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Dropdown
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Action</a></li>
            <li><a class="dropdown-item" href="#">Another action</a></li>

            <li><a class="dropdown-item" href="#">Something else here</a></li>

    <div class="container">
        <div class="row">
            <div class="col"></div>
            <div class="col">
                <div id="form">
                    <form onsubmit="modifica(event)">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" required>
                        </div>

                        <div class="mb-3">
                            <label for="cognome" class="form-label">Cognome</label>
                            <input type="text" class="form-control" id="cognome" required>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>

                        <div id="cliente">
                            <div class="mb-3">
                                <label for="nCarta" class="form-label">Numero di Carta</label>
                                <input type="text" class="form-control" id="carta" >
                            </div>

                            <div class="mb-3">
                                <label for="dataCarta" class="form-label">Data di Scadenza</label>
                                <input type="date" class="form-control" id="dataCarta" >
                            </div>

                            <div class="mb-3">
                                <label for="CVVCarta" class="form-label">CVV</label>
                                <input type="number" class="form-control" id="CVVCarta" min="100" max="999">
                            </div>
                        </div>

                        <div class="d-flex justify-content-center">
                            <button type="submit" class="btn btn-primary">Modifica</button>
                        </div>
                    </form>
                </div>
                <div class="mt-5 d-flex justify-content-center">
                    <button class="btn btn-outline-danger" onclick="cancella()">Cancella Account</button>
                </div>
            </div>
            <div class="col"></div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
    <script>
        document.addEventListener("DOMContentLoaded", ()=>{
            //se l'utente non è autenticato viene mandato alla login
            if(localStorage.getItem("auth")===null){
                localStorage.clear();
                window.location.replace("../index.html");
            }

            //faccio puntare il pulsante home alla pagina corretta
            let tipo=localStorage.getItem("accType");
            document.getElementById("homelink").href=`${tipo}/${tipo}.html`;

            //carico i dati del form
            const id = localStorage.getItem("auth");
            fetch(`http://server-t410:3000/user/${id}`)
                .then(response => response.json())
                .then(result => {
                    console.log(result);
                    if(result.success===true){
                        const user= JSON.parse(result.user);

                        document.getElementById("nome").value = user.nome;
                        document.getElementById("cognome").value = user.cognome;
                        document.getElementById("username").value = user.username;
                        document.getElementById("email").value = user.email;
                        document.getElementById("password").value = user.password;

                        if(user.tipo=="cliente"){
                            document.getElementById("carta").value = user.ncarta;
                            document.getElementById("dataCarta").value = user.datacarta;
                            document.getElementById("CVVCarta").value = user.cvvcarta;
                        }
                        else{
                            document.getElementById("cliente").style.display="none";
                        }
                    }
                        
                    else{
                        alert(result.message);
                    }
                });


        });

        function modifica(event) {
            event.preventDefault(); //blocca il refresh della pagina

            const id=localStorage.getItem("auth");
            const nome = document.getElementById('nome').value;
            const cognome = document.getElementById('cognome').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const tipo=localStorage.getItem("accType");

            const user = {
                nome: nome,
                cognome: cognome,
                username: username,
                email: email,
                password: password,
                tipo: tipo
            };

            if (tipo=="cliente") {
                const ncarta = document.getElementById('carta').value;
                const datacarta = document.getElementById('dataCarta').value;
                const cvvcarta = document.getElementById('CVVCarta').value;

                user.ncarta = ncarta;
                user.datacarta = datacarta;
                user.cvvcarta = cvvcarta;
            }

            const options = {
                method: "PUT",
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(user)
            };

            fetch(`http://server-t410:3000/user/${id}`, options)
                .then(response => response.json())
                .then(result => {
                    console.log(result);
                    if(result.success===true){
                        window.location.replace(`${tipo}/${tipo}.html`); //se la modifica va a buon fine si viene rendirizzati alla corrispettiva home
                    }
                    else{
                        alert(result.message);
                    }
                });
        }

        function cancella(){
            if (confirm("Sei sicuro di voler procedere?") == true) {
                const id=localStorage.getItem("auth");

                const options = {
                    method: "DELETE",
                    headers: {
                        'Content-Type': 'application/json'
                    }
                };

                fetch(`http://server-t410:3000/user/${id}`, options)
                    .then(response => response.json())
                    .then(result => {
                        console.log(result);
                        if(result.success===true){
                            localStorage.clear();
                            window.location.replace(`../index.html`); //se la cancellazione va a buon fine si viene rendirizzati alla login
                        }
                        else{
                            alert(result.message);
                        }
                    });
            }
        }

        function logout(){
            localStorage.clear();
            window.location.replace("../index.html");
        }
    </script>
</body>
</html>
