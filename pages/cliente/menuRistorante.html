<body>

    <div class="mt-4">
        <a href="ristoranti.html"><button class="btn btn-outline-primary">Indietro</button></a>
    </div>

    <div class="row">
        <div class="col-4">
            <form onsubmit="cerca(event)">
                <div class="mt-4 input-group">
                    <input id="nomeCat" type="search" class="form-control rounded" placeholder="Nome/Categoria"/>
                    <input id="prezzo" type="search" class="form-control rounded" placeholder="Prezzo"/>
                    <button type="submit" class="btn btn-outline-primary">Cerca</button>
                </div>
            </form>
        </div>
    </div>

    <div class="mt-2">
        <table class="table table-sm table-striped text-center align-middle">
        <tr>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Prezzo</th>
            <th>Immagine</th>
            <th>Operazioni</th>
        </tr>
        <tr id="modello" class="d-none">
            <td></td>
            <td></td>
            <td></td>
            <td><img class="thumb" src=""></td>
            <td>
                <button class="btn btn-sm btn-outline-success" onclick="aggiungi(event)">+</button>
                <button class="btn btn-sm btn-outline-danger" onclick="rimuovi(event)">-</button>
            </td>
        </tr>
    </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
    crossorigin="anonymous"></script>
    <script>
        document.addEventListener("DOMContentLoaded", ()=>{
            //se l'utente non è autenticato viene mandato alla login
            if(localStorage.getItem("auth")===null || localStorage.getItem("accType")!="cliente"){
                localStorage.clear();
                window.location.replace("../../index.html");
            }

            //se non c'è nessun ristorante di cui visualizzare il menù l'utente viene mandato alla lista di ristoranti
            if(localStorage.getItem["ristorante"]===null){
                window.location.replace("ristoranti.html");
            }
            
            caricaMenu();
        });

        function caricaMenu(){
            const idRistorante=localStorage.getItem("ristorante");
            console.log(idRistorante);
            fetch(`http://server-t410:3000/piatti/${idRistorante}`)
                .then(response => response.json())
                .then(result => {
                    console.log(result);
                    if(result.success===true){
                        const piatti=JSON.parse(result.piatti);

                        piatti.sort((a, b) => a.categoria.localeCompare(b.categoria)); //ordina per categoria facendo una compare tra un elemento e il suo successivo
                        
                        var modello = document.getElementById('modello');

                        for(let i=0;i<piatti.length;i++){
                        var clone = modello.cloneNode(true);
                        var piatto = piatti[i];

                        clone.getElementsByTagName('td')[0].innerHTML += piatto.nome;
                        clone.getElementsByTagName('td')[1].innerHTML += piatto.categoria;
                        clone.getElementsByTagName('td')[2].innerHTML += piatto.prezzo;
                        clone.getElementsByTagName('img')[0].src = piatto.img;

                        let bottoni=clone.getElementsByTagName('button');
                        for(let j=0;j<bottoni.length;j++){
                            bottoni[j].value=piatto._id;
                        }

                        clone.removeAttribute("id"); //rimuovo l'id per evitare conflitti
                        clone.removeAttribute("class"); //rimuovo l'intero attributo perchè class veniva usato solo per d-none
                        modello.before(clone);
                        }
                    }
                    else{
                        alert(result.message);
                    }
                });

        }

        function aggiungi(event){

        }

        function rimuovi(event){

        }

        function cerca(event){
            event.preventDefault(); //blocca il refresh della pagina
            const nomeCat = document.getElementById("nomeCat");
            const prezzo = document.getElementById("prezzo");
            let q = nomeCat.value.trim().toLowerCase();
            let p = prezzo.value.trim();

            // seleziono tutte le righe della tabella
            const rows = document.querySelectorAll('table tr');
            rows.forEach(row => {
                const cells = row.getElementsByTagName('td');
                if(cells.length === 0) return; // salta intestazione
                if(row.id === 'modello') return; // mantiene il modello nascosto

                const name = (cells[0].textContent || '').trim().toLowerCase();
                const cat = (cells[1].textContent || '').trim().toLowerCase();
                const price=parseInt(cells[2].textContent);

                let matchQuery=q === '' || name.includes(q) || cat.includes(q); //è un match se la la stringa è vuota oppure è contenuta dentro i campi
                let matchPrice = p === '' || price <= parseInt(p); //è un match se il valore è vuoto o se il prezzo del piatto è inferiore

                if(matchQuery&&matchPrice){
                    row.classList.remove('d-none');
                } else {
                    row.classList.add('d-none');
                }
            });
        }

        function logout(){
            localStorage.clear();
            window.location.replace("../../index.html");
        }

    </script>
</body>
</html>
