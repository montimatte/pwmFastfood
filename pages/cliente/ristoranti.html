    <div class="row">
        <div class="col-3">
            <form onsubmit="cerca(event)">
                <div class="mt-4 input-group">
                    <input type="search" class="form-control rounded" placeholder="Cerca"/>
                    <button type="submit" class="btn btn-outline-primary">Cerca</button>
                </div>
            </form>
        </div>
    </div>
    
    <div class="row mt-3">
        <div id="modello" class="col-lg-4 col-md-6 d-none">
            <div class="card">
                <img src="" class="card-img-top" alt="">
                <div class="card-body">
                    <h5 class="card-title nome"></h5>
                    <p class="card-text indirizzo"></p>
                    <p class="card-text telefono">Telefono: </p>
                    <button onclick="getMenu(event)" class="btn btn-primary">Visualizza Menù</button>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
    crossorigin="anonymous"></script>
    <script>
        document.addEventListener("DOMContentLoaded", ()=>{
            //se l'utente non è autenticato viene mandato alla login
            if(localStorage.getItem("auth")===null || localStorage.getItem("accType")!="cliente"){
                localStorage.clear();
                window.location.replace("../../index.html");
            }
            
            getRistoranti();
        });

        function getRistoranti(){
            fetch(`http://localhost:3000/ristoranti`)
                .then(response => response.json())
                .then(result => {
                    console.log(result);
                    if(result.success===true){
                        const ristoranti=JSON.parse(result.rest);
                        var modello = document.getElementById('modello');
                        for (var i = 0; i < ristoranti.length; i++) {
                            var clone = modello.cloneNode(true);
                            var ristorante = ristoranti[i];

                            clone.getElementsByClassName('card-title')[0].innerHTML += ristorante.nome;
                            clone.getElementsByClassName('card-text')[0].innerHTML += ristorante.indirizzo+" - "+ristorante.citta;
                            clone.getElementsByClassName('card-text')[1].innerHTML += ristorante.telefono;

                            clone.getElementsByTagName('button')[0].value = ristorante._id;

                            clone.classList.remove('d-none');
                            clone.id = i;
                            modello.before(clone);
                        }
                    }  
                    else{
                        alert(result.message);
                    }
                });
            }

        function getMenu(event){
            let id=event.target.value;
            localStorage.setItem("ristorante",id);
            window.location.replace("menuRistorante.html");
        }

        function cerca(event){
            event.preventDefault(); //blocca il refresh della pagina
            const form = event.target;
            const input = form.querySelector('input[type="search"]');
            if(!input) return;
            const q = input.value.trim().toLowerCase();

            // seleziona tutte le card (sono contenute in colonne)
            const cols = document.querySelectorAll('.row .col-lg-4.col-md-6');
            cols.forEach(col => {
                // se il modello nascosto (d-none) lo saltiamo
                if(col.classList.contains('d-none')) return;
                const title = col.getElementsByClassName("nome")[0].innerHTML.toLowerCase();
                const cat = col.getElementsByClassName("indirizzo")[0].innerHTML.toLowerCase();

                if(q === '' || title.includes(q) || cat.includes(q)){
                    col.style.display = '';
                } else {
                    col.style.display = 'none';
                }
            });

        }

        function logout(){
            localStorage.clear();
            window.location.replace("../../index.html");
        }

    </script>
</body>
</html>
