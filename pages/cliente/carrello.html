<nav class="navbar bg-body-tertiary">
    <div class="container-fluid justify-content-end">

    <button class="btn btn-outline-success me-2" onclick="ordina()">Conferma Ordini</button>

    <div class="container">
        <div id="modello" class="card mt-4 d-none">
            <h5 class="card-header">Ristorante</h5>
            <div class="card-body">
                <ul>
                </ul>
                <div class="card-footer text-end">
                    <h5>Totale: 0</h5>
                    <button class="btn btn-outline-danger mt-2" onclick="cancella(event)">Cancella Ordine</button> 
                </div>
            </div>
        </div>
    </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
    crossorigin="anonymous"></script>
  <script>
        document.addEventListener("DOMContentLoaded", ()=>{
          //se l'utente non è autenticato viene mandato alla login
          if(localStorage.getItem("auth")===null || localStorage.getItem("accType")!="cliente"){
              localStorage.clear();
              window.location.replace("../../index.html");
          }
          getCarrello();
        });

      async function getCarrello(){
        let carrello=JSON.parse(localStorage.getItem("carrello"));
        if(carrello){
            let sub=0;
            let tot=0;
            var modello = document.getElementById('modello');
            // per ogni ristorante presente nel carrello ottengo i relativi piatti e gestisco i dati nel DOM
            for (const idRist in carrello) {
                sub=0;   
                var clone = modello.cloneNode(true);

                const objRest = carrello[idRist];

                await fetch(`http://localhost:3000/ristoranti/${idRist}`)
                .then(response => response.json())
                .then(result => {
                    console.log(result);
                    if(result.success===true){
                        const ristorante=JSON.parse(result.rest);
                        clone.getElementsByTagName('h5')[0].innerHTML = `${ristorante.nome} (${ristorante.indirizzo} - ${ristorante.citta}) `;
                    }  
                    else{
                        alert(result.message);
                    }
                });
                
                let lista=clone.getElementsByTagName("ul")[0];
                for (const idPiatto in objRest) {                    
                    const objPiatto = objRest[idPiatto];
                    await fetch(`http://localhost:3000/piatto/${idPiatto}`)
                    .then(response => response.json())
                    .then(result => {
                        console.log(result);
                        if(result.success===true){
                            const piatto=JSON.parse(result.piatto);

                            let el=document.createElement("li");
                            el.classList.add("card-text");
                            el.innerHTML=`${objPiatto}x ${piatto.nome} (${piatto.prezzo})`;

                            lista.appendChild(el);
                            sub+=piatto.prezzo*objPiatto;
                        }  
                        else{
                            alert(result.message);
                        }
                    });
                }
                clone.getElementsByTagName("button")[0].value=idRist;
                clone.getElementsByTagName('h5')[1].innerHTML = "Totale: "+sub;
				        clone.getElementsByTagName('h5')[1].id = idRist;
                tot+=sub;

                clone.classList.remove("d-none");
                modello.before(clone);
            }
            document.getElementById("totale").innerHTML="Totale: "+tot;
        }
      }

      function cancella(event){
        if(confirm("Sei sicuro di voler procedere?")==true){
          let carrello=JSON.parse(localStorage.getItem("carrello"));
          let idRist=event.target.value;
          delete carrello[idRist];
          localStorage.setItem("carrello",JSON.stringify(carrello));
          window.location.reload();
        }
      }

      function svuota(){
        if(confirm("Sei sicuro di voler procedere?")==true){
          localStorage.removeItem("carrello");
          window.location.reload();
        }
      }

      async function ordina(){
        //se non sono inseriti i dati della carta di credito mostro un alert
        const id = localStorage.getItem("auth");
        await fetch(`http://localhost:3000/user/${id}`)
            .then(response => response.json())
            .then(result => {
                console.log(result);
                if(result.success===true){
                    const user= JSON.parse(result.user);

					if(user.ncarta==""||user.datacarta==""||user.cvvcarta==""){
						alert("I dati della carta non sono completi, inseriscili nella pagina Account!");
						return;
					}
                }                    
                else{
                    alert(result.message);
                }
            });

			const carrello=JSON.parse(localStorage.getItem("carrello"));
			for (const idRist in carrello) {
				const user=localStorage.getItem("auth");
				const tot=parseFloat(document.getElementById(idRist).innerHTML.split(":")[1].trim()); //prendo il totale del ristorante e rimuovo la parte stringa
				const piatti=carrello[idRist];
				let ritiro;
        let creazione=new Date().toLocaleString('sv-SE')//l'ora svedese è formattata yyyy-MM-dd hh:mm:ss ed è la stessa dell'Italia anche per ora legale/solare;

				//calcolo il tempo di attesa per l'ordine (10min per ordine in coda)
				const filter={
					id_ristorante: idRist,
					$or:[{stato:"ordinato"},{stato:"in preparazione"}]
				};

				let options = {
					method: "POST",
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify(filter)
				};

				await fetch("http://localhost:3000/ordini", options)
					.then(response => response.json())
					.then(result => {
						console.log(result);
						if(result.success===true){
							const ordini=JSON.parse(result.ord);

							//ottengo l'ora corrente, aggiungo i minuti di attesa ed estraggo l'ora e i minuti in due cifre
							const attesa = 10 + (10 * ordini.length);
							const ritiroDate = new Date();
							ritiroDate.setMinutes(ritiroDate.getMinutes() + attesa);
							const opzioniFormato = { hour: '2-digit', minute: '2-digit' };
							ritiro = ritiroDate.toLocaleTimeString('it-IT', opzioniFormato);

							console.log(ordini.length);
							console.log(attesa);
							console.log(ritiro);
						}
						else{
							alert(result.message);
						}
					});

				const ordine={
					id_utente: user,
					id_ristorante: idRist,
					stato: "ordinato",
					piatti: piatti,
					totale: tot,
          data_creazione: creazione,
					ora_ritiro: ritiro,
          data_consegna:"" //è l'ora di ritiro effettiva che verrà inserita poi dal ristoratore
				};

				options = {
					method: "POST",
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify(ordine)
				};

				fetch("http://localhost:3000/ordine", options)
					.then(response => response.json())
					.then(result => {
						console.log(result);
						if(result.success===true){
							localStorage.removeItem("carrello");
							window.location.replace("cliente.html");
						}
						else{
							alert(result.message);
						}
					});

					
			}
      	}

      function logout(){
          localStorage.clear();
          window.location.replace("../../index.html");
      }

  </script>
