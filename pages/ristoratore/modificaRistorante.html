<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dettagli Ristorante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>

<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Fast Food</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="ristoratore.html" id="homelink">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Ristorante</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="menu.html">Menù</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="../account.html">Account</a>
        </li>
      </ul>
      <div class="d-flex">
        <button class="btn btn-outline-secondary" onclick="logout()">Logout</button>
      </form>
    </div>
  </div>
</nav>

    <div class="container">
        <div class="row">
            <div class="col"></div>
            <div class="col">
                <div id="form">
                    <form onsubmit="modifica(event)">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" required>
                        </div>

                        <div class="mb-3">
                            <label for="indirizzo" class="form-label">Indirizzo</label>
                            <input type="text" class="form-control" id="indirizzo" required>
                        </div>

                        <div class="mb-3">
                            <label for="citta" class="form-label">Città</label>
                            <input type="text" class="form-control" id="citta" required>
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label">Telefono</label>
                            <input type="text" class="form-control" id="telefono" required>
                        </div>

                        <div class="mb-3">
                            <label for="iva" class="form-label">P. IVA</label>
                            <input type="text" class="form-control" id="iva" required>
                        </div>

                        <div class="d-flex justify-content-center">
                            <button type="submit" class="btn btn-primary">Modifica</button>
                        </div>
                    </form>
                </div>
                <div class="mt-5 d-flex justify-content-center">
                    <button class="btn btn-outline-danger" onclick="cancella()">Cancella Ristorante</button>
                </div>
            </div>
            <div class="col"></div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
    <script>
        document.addEventListener("DOMContentLoaded", ()=>{
            //se l'utente non è autenticato viene mandato alla login
            if(localStorage.getItem("auth")===null || localStorage.getItem("accType")!="ristoratore"){
                localStorage.clear();
                window.location.replace("../../index.html");
            }

            //carico i dati del form
            const id = localStorage.getItem("auth");
            fetch(`http://server-t410:3000/ristorante/${id}`)
                .then(response => response.json())
                .then(result => {
                    console.log(result);
                    if(result.success===true){
                        const rest= JSON.parse(result.rest);

                        document.getElementById("nome").value = rest.nome;
                        document.getElementById("indirizzo").value = rest.indirizzo;
                        document.getElementById("citta").value = rest.citta;
                        document.getElementById("telefono").value = rest.telefono;
                        document.getElementById("iva").value = rest.iva;
                    }  
                    else{
                        alert(result.message);
                    }
                });


        });

        function modifica(event) {
            event.preventDefault(); //blocca il refresh della pagina

            const nome = document.getElementById('nome').value;
            const indirizzo = document.getElementById('indirizzo').value;
            const citta = document.getElementById('citta').value;
            const telefono = document.getElementById('telefono').value;
            const iva = document.getElementById('iva').value;
            const proprietario= localStorage.getItem("auth");

            const rest = {
                nome: nome,
                indirizzo: indirizzo,
                citta: citta,
                telefono: telefono,
                iva: iva,
            };

            const options = {
                method: "PUT",
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(rest)
            };

            fetch(`http://server-t410:3000/ristorante/${proprietario}`, options)
                .then(response => response.json())
                .then(result => {
                    console.log(result);
                    if(result.success===true){
                        window.location.replace("ristoratore.html"); //se la modifica va a buon fine si viene rendirizzati alla home
                    }
                    else{
                        alert(result.message);
                    }
                });
        }

        function cancella(){
            if (confirm("Sei sicuro di voler procedere?") == true) {
                const id=localStorage.getItem("auth");

                const options = {
                    method: "DELETE",
                    headers: {
                        'Content-Type': 'application/json'
                    }
                };

                fetch(`http://server-t410:3000/ristorante/${id}`, options)
                    .then(response => response.json())
                    .then(result => {
                        console.log(result);
                        if(result.success===true){
                            localStorage.clear();
                            window.location.replace(`ristoratore.html`); //se la cancellazione va a buon fine si viene rendirizzati alla home
                        }
                        else{
                            alert(result.message);
                        }
                    });
            }
        }

        function logout(){
            localStorage.clear();
            window.location.replace("../../index.html");
        }
    </script>
</body>
</html>
