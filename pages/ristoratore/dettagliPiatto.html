<body class="centerBody">

    <div class="container-fluid">

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
            <a class="nav-link" href="#" >Home</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="creaRistorante.html">Ristorante</a>

            <a class="nav-link active" aria-current="page" href="menu.html">Menù</a>

    <div class="mt-4">
        <a href="menu.html"><button class="btn btn-outline-primary">Indietro</button></a>
    </div>

    <div class="mt-3 row">
        <div class="col"></div>
        <div class="col">
            <div class="card">
                <img src="" id="img" class="card-img-top" alt="">
                <div class="card-body">
                    <h5 id="nome" class="card-title"></h5>
                    <p id="categoria" class="card-text"></p>
                    <p id="prezzo" class="card-text"></p>
                    <p id="ingredienti" class="card-text"></p>
                    <p id="ricetta" class="card-text"></p>
                </div>
            </div>
        </div>
        <div class="col"></div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
    crossorigin="anonymous"></script>
    <script>
        document.addEventListener("DOMContentLoaded", ()=>{
            //se l'utente non è autenticato viene mandato alla login
            if(localStorage.getItem("auth")===null || localStorage.getItem("accType")!="ristoratore"){
                localStorage.clear();
                window.location.replace("../../index.html");
            }
            
            //l'utente viene rendirizzato alla pagine di creazione se non ha ancora creato il ristorante
            const proprietario= localStorage.getItem("auth");
            fetch(`http://server-t410:3000/ristorante/${proprietario}`)
                .then(response => {
                    console.log(response.status);
                    if(response.status===404){
                        window.location.replace("creaRistorante.html");
                    }
                });
            
            //l'utente viene rimandato al menù se non c'è nessun piatto di cui vedere i dettagli
            if(!localStorage.getItem("idPiatto")){
                window.location.replace("menu.html");
            }
        
            caricaDati();

        });

        function caricaDati(){
            let id=localStorage.getItem("idPiatto");
           fetch(`http://server-t410:3000/piatto/${id}`)
                .then(response => response.json())
                .then(result => {
                    console.log(result);
                    if(result.success===true){
                        const piatto=JSON.parse(result.piatto);
                        
                        document.getElementById("img").src=piatto.img;
                        document.getElementById("nome").innerHTML=piatto.nome;
                        document.getElementById("categoria").innerHTML=piatto.categoria;
                        document.getElementById("prezzo").innerHTML=piatto.prezzo;
                        //metto assieme ingredienti
                        let str="";
                        for(let i=0;i<piatto.ingredienti.length;i++){
                            str+=piatto.ingredienti[i]+"<br>";
                        }
                        document.getElementById("ingredienti").innerHTML=str;
                        document.getElementById("ricetta").innerHTML=piatto.ricetta;

                    }
                    else{
                        alert(result.message);
                    }
                });
            
                localStorage.removeItem("idPiatto");
        }
    </script>
</body>
</html>
