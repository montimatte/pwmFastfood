<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifica Piatto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Fast Food</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
            <a class="nav-link" href="#" >Home</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="creaRistorante.html">Ristorante</a>
            </li>
            <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="menu.html">Menù</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="../account.html">Account</a>
            </li>
        </ul>
        <div class="d-flex">
            <button class="btn btn-outline-secondary" onclick="logout()">Logout</button>
        </form>
        </div>
    </div>
    </nav>

    <div class="mt-4">
        <a href="menu.html"><button class="btn btn-outline-primary">Indietro</button></a>
    </div>

    <div class="container">
        <div class="row">
            <div class="col"></div>
            <div class="col">
                <div id="form">
                    <form onsubmit="modificaPiatto(event)">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" required>
                        </div>

                        <div class="mb-3">
                            <label for="categoria" class="form-label">Categoria</label>
                            <input type="text" class="form-control" id="categoria" required>
                        </div>

                        <div class="mb-3">
                            <label for="prezzo" class="form-label">Prezzo</label>
                            <input type="number" class="form-control" id="prezzo" min="0.5" step="0.5" required>
                        </div>


                        <div class="mb-3">
                            <label for="img" class="form-label">Link Immagine</label>
                            <input type="text" class="form-control" id="img" required>
                        </div>

                        <div class="mb-3">
                            <label for="ingredienti" class="form-label">Ingredienti</label>
                            <textarea class="form-control" id="ingredienti" style="min-height: 150px;"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="ricetta" class="form-label">Ricetta</label>
                            <textarea class="form-control" id="ricetta" style="min-height: 150px;"></textarea>
                        </div>

                        <div class="d-flex justify-content-center">
                            <button id="btnModifica" type="submit" class="btn btn-primary">Modifica</button>
                        </div>
                    </form>
                </div>
                <div class="mt-5 d-flex justify-content-center">
                   <button id="btnCancella" onclick="cancellaPiatto(event)" class="btn btn-outline-danger">Cancella</button>
                </div>
            </div>
            <div class="col"></div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
    crossorigin="anonymous"></script>
    <script>
        document.addEventListener("DOMContentLoaded", ()=>{
            //se l'utente non è autenticato viene mandato alla login
            if(localStorage.getItem("auth")===null || localStorage.getItem("accType")!="ristoratore"){
                localStorage.clear();
                window.location.replace("../../index.html");
            }
            
            //l'utente viene rendirizzato alla pagine di creazione se non ha ancora creato il ristorante
            const proprietario= localStorage.getItem("auth");
            fetch(`http://localhost:3000/ristorante/${proprietario}`)
                .then(response => {
                    console.log(response.status);
                    if(response.status===404){
                        window.location.replace("creaRistorante.html");
                    }
                });

            //l'utente viene rimandato al menù se non c'è nessun piatto di cui modificare i dettagli
            if(!localStorage.getItem("idPiatto")){
                window.location.replace("menu.html");
            }
        
                caricaDati();

        });

        function caricaDati(){
            let id=localStorage.getItem("idPiatto");
           fetch(`http://localhost:3000/piatto/${id}`)
                .then(response => response.json())
                .then(result => {
                    console.log(result);
                    if(result.success===true){
                        let piatto=JSON.parse(result.piatto);
                        document.getElementById("nome").value=piatto.nome;
                        document.getElementById("categoria").value=piatto.categoria;
                        document.getElementById("prezzo").value=piatto.prezzo;
                        document.getElementById("img").value=piatto.img;
                        //metto assieme ingredienti
                        let str="";
                        for(let i=0;i<piatto.ingredienti.length;i++){
                            str+=piatto.ingredienti[i]+", ";
                        }
                        document.getElementById("ingredienti").innerText=str;
                        document.getElementById("ricetta").innerText=piatto.ricetta;

                        document.getElementById("btnModifica").value=id;
                        document.getElementById("btnCancella").value=id;

                    }
                    else{
                        alert(result.message);
                    }
                });
            
                localStorage.removeItem("idPiatto");
        }


        async function modificaPiatto(event) {
            event.preventDefault(); //blocca il refresh della pagina
            let id=document.getElementById("btnModifica").value;
            console.log(id);

            const nome=document.getElementById("nome").value;
            const categoria=document.getElementById("categoria").value;
            const img=document.getElementById("img").value;
            const prezzo=document.getElementById("prezzo").value;
            const ingredienti=document.getElementById("ingredienti").value;
            const ricetta=document.getElementById("ricetta").value;
            let idRistorante;

            const proprietario= localStorage.getItem("auth");
            await fetch(`http://localhost:3000/ristorante/${proprietario}`) //l'await server per essere sicuri che prima di inserire il piatto io abbia l'id del ristorante
                .then(response => response.json())
                .then(result => {
                    console.log(result);
                    if(result.success===true){
                        let rest=JSON.parse(result.rest);
                        idRistorante=rest._id;
                    }
                    else{
                        alert(result.message);
                    }
                });


            const piatto={
                nome: nome,
                categoria: categoria,
                img: img,
                prezzo: prezzo,
                ingredienti: ingredienti,
                ricetta: ricetta,
                id_ristorante: idRistorante
            }
            console.log(piatto);

            const options = {
                method: "PUT",
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(piatto)
            };

            fetch(`http://localhost:3000/piatto/${id}`, options)
                .then(response => response.json())
                .then(result => {
                    console.log(result);
                    if(result.success===true){
                        window.location.replace("menu.html"); //se la modifica va a buon fine si viene rendirizzati al menù
                    }
                    else{
                        alert(result.message);
                    }
                });
        }

        function cancellaPiatto(event){
            if (confirm("Sei sicuro di voler procedere?") == true) {
                let id=event.target.value;

                const options = {
                    method: "DELETE",
                    headers: {
                        'Content-Type': 'application/json'
                    }
                };

                fetch(`http://localhost:3000/piatto/${id}`, options)
                    .then(response => response.json())
                    .then(result => {
                        console.log(result);
                        if(result.success===true){
                            window.location.replace(`menu.html`); //se la cancellazione va a buon fine si viene rendirizzati al menù
                        }
                        else{
                            alert(result.message);
                        }
                    });
            }
        }

        function logout(){
            localStorage.clear();
            window.location.replace("../../index.html");
        }

    </script>
</body>
</html>
