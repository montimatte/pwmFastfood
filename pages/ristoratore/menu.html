<html lang="en">
<head>
    <meta charset="UTF-8">

    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="../../mystyle.css">
</head>
<body>

    <div class="container-fluid">
        <a class="navbar-brand" href="#">Fast Food</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
            <a class="nav-link" href="ristoratore.html" >Home</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="creaRistorante.html">Ristorante</a>
            </li>
            <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Menù</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="../account.html">Account</a>
            </li>
        </ul>
        <div class="d-flex">
            <button class="btn btn-outline-secondary" onclick="logout()">Logout</button>
        </form>
        </div>

    <div class="mt-4">
        <a href="aggiungiPiatto.html"><button class="btn btn-outline-primary">Aggiungi Piatto</button></a>
    </div>

    <div class="row">
        <div class="col-3">
            <form onsubmit="cerca(event)">
                <div class="mt-4 input-group">
                    <input type="search" class="form-control rounded" placeholder="Cerca"/>
                    <button type="submit" class="btn btn-outline-primary">Cerca</button>
                </div>
            </form>
        </div>
    </div>

    <div class="mt-2">
        <table class="table table-sm table-striped text-center align-middle">
        <tr>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Prezzo</th>
            <th>Immagine</th>
            <th>Operazioni</th>
        </tr>
        <tr id="modello" class="d-none">
            <td></td>
            <td></td>
            <td></td>
            <td><img class="thumb" src=""></td>
            <td>
                <div class="row mb-2"><button class="btn btn-sm btn-outline-info" onclick="dettagli(event)">Dettagli</button></div>
                <div class="row mb-2"><button class="btn btn-sm btn-outline-warning" onclick="modifica(event)">Modifica</button></div>
            </td>
        </tr>
    </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
    crossorigin="anonymous"></script>
    <script>
        document.addEventListener("DOMContentLoaded", ()=>{
            //se l'utente non è autenticato viene mandato alla login
            if(localStorage.getItem("auth")===null || localStorage.getItem("accType")!="ristoratore"){
                localStorage.clear();
                window.location.replace("../../index.html");
            }
            
            //l'utente viene rendirizzato alla pagine di creazione se non ha ancora creato il ristorante
            const proprietario= localStorage.getItem("auth");
            fetch(`http://localhost:3000/ristorante/${proprietario}`)
                .then(response => {
                    console.log(response.status);
                    if(response.status===404){
                        window.location.replace("creaRistorante.html");
                    }
                });

                caricaMenu();
        });

        async function caricaMenu(){
            const proprietario= localStorage.getItem("auth");
            await fetch(`http://localhost:3000/ristorante/${proprietario}`) //l'await server per essere sicuri che prima di inserire il piatto io abbia l'id del ristorante
                .then(response => response.json())
                .then(result => {
                    console.log(result);
                    if(result.success===true){
                        let rest=JSON.parse(result.rest);
                        idRistorante=rest._id;
                    }
                    else{
                        alert(result.message);
                    }
                });

            fetch(`http://localhost:3000/piatti/${idRistorante}`)
                .then(response => response.json())
                .then(result => {
                    console.log(result);
                    if(result.success===true){
                        const piatti=JSON.parse(result.piatti);

                        piatti.sort((a, b) => a.categoria.localeCompare(b.categoria)); //ordina per categoria facendo una compare tra un elemento e il suo successivo
                        
                        var modello = document.getElementById('modello');

                        for(let i=0;i<piatti.length;i++){
                        var clone = modello.cloneNode(true);
                        var piatto = piatti[i];

                        clone.getElementsByTagName('td')[0].innerHTML += piatto.nome;
                        clone.getElementsByTagName('td')[1].innerHTML += piatto.categoria;
                        clone.getElementsByTagName('td')[2].innerHTML += piatto.prezzo;
                        clone.getElementsByTagName('img')[0].src = piatto.img;

                        let bottoni=clone.getElementsByTagName('button');
                        for(let j=0;j<bottoni.length;j++){
                            bottoni[j].value=piatto._id;
                        }

                        clone.removeAttribute("id"); //rimuovo l'id per evitare conflitti
                        clone.removeAttribute("class"); //rimuovo l'intero attributo perchè class veniva usato solo per d-none
                        modello.before(clone);
                        }
                    }
                    else{
                        alert(result.message);
                    }
                });

        }

        function dettagli(event){
            let id=event.target.value;
            localStorage.setItem("idPiatto",id);
            localStorage.setItem("backPage","ristoratore/menu.html");
            window.location.replace("../dettagliPiatto.html");
        }

        function modifica(event){
            let id=event.target.value;
            localStorage.setItem("idPiatto",id);
            window.location.replace("modificaPiatto.html");
        }

        function cerca(event){
            event.preventDefault(); //blocca il refresh della pagina
            const form = event.target;
            const query = (form.querySelector('input[type="search"]').value || '').trim().toLowerCase();

            // seleziono tutte le righe della tabella
            const rows = document.querySelectorAll('table tr');
            rows.forEach(row => {
                const cells = row.getElementsByTagName('td');
                if(cells.length === 0) return; // salta intestazione
                if(row.id === 'modello') return; // mantiene il modello nascosto

                const nome = (cells[0].textContent || '').trim().toLowerCase();
                const categoria = (cells[1].textContent || '').trim().toLowerCase();

                if(query === '' || nome.includes(query) || categoria.includes(query)){
                    row.classList.remove('d-none');
                } else {
                    row.classList.add('d-none');
                }
            });
        }

        function logout(){
            localStorage.clear();
            window.location.replace("../../index.html");
        }

    </script>
</body>
</html>
