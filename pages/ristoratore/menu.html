    <script>
        document.addEventListener("DOMContentLoaded", ()=>{
            //se l'utente non è autenticato viene mandato alla login
            if(localStorage.getItem("auth")===null || localStorage.getItem("accType")!="ristoratore"){
                localStorage.clear();
                window.location.replace("../../index.html");
            }
            
            //l'utente viene rendirizzato alla pagine di creazione se non ha ancora creato il ristorante
            const proprietario= localStorage.getItem("auth");
            fetch(`http://server-t410:3000/ristorante/${proprietario}`)
                .then(response => {
                    console.log(response.status);
                    if(response.status===404){
                        window.location.replace("creaRistorante.html");
                    }
                });
        });

        function logout(){
            localStorage.clear();
            window.location.replace("../../index.html");
        }

    </script>
