<!DOCTYPE html>
<html lang="en">
<head>

    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">

</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Fast Food</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#" >Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" onclick="manageRistorante()">Ristorante</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="../account.html">Account</a>
        </li>
      </ul>
      <div class="d-flex">
        <button class="btn btn-outline-secondary" onclick="logout()">Logout</button>
      </form>
    </div>
  </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
    crossorigin="anonymous"></script>
<script>
    document.addEventListener("DOMContentLoaded", ()=>{
        //se l'utente non è autenticato viene mandato alla login
        if(localStorage.getItem("auth")===null || localStorage.getItem("accType")!="ristoratore"){
            localStorage.clear();
            window.location.replace("../../index.html");
        }
    });

    function manageRistorante(){
        //l'utente viene rendirizzato alla pagine di creazione se non ha ancora creato il ristorante, altrimenti alla pagina di modifica
        const proprietario= localStorage.getItem("auth");
        fetch(`http://server-t410:3000/ristorante/${proprietario}`)
            .then(response => {
                console.log(response.status);
                if(response.status===404){
                    window.location.replace("creaRistorante.html");
                }
                else if(response.status===200){
                    window.location.replace("modificaRistorante.html");
                }
            });
    }

    function logout(){
        localStorage.clear();
        window.location.replace("../../index.html");
    }

</script>
</body>
</html>
